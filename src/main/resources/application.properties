spring.application.name=royal-curtains-store-management
server.port=8080

# PostgreSQL settings. Update these values for your local database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/royal_curtains}
spring.datasource.username=${DB_USERNAME:saeedsekandari}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

# Temporary manager account for local development.
# Set MANAGER_USERNAME and MANAGER_PASSWORD as environment variables later.
app.security.manager-username=${MANAGER_USERNAME:manager}
app.security.manager-password=${MANAGER_PASSWORD:ChangeMe123!}
