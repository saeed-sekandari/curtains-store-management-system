<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Accounts</title>
</head>

<body>

<main>
    <h1>User Accounts</h1>

    <p>
        This page shows the accounts that can log in to the system.
    </p>

    <p>
        <a href="/users/new">Create New Account</a>
        |
        <a href="/dashboard">Back to Dashboard</a>
    </p>

    <table border="1" cellpadding="8">
        <thead>
        <tr>
            <th>Username</th>
            <th>Full Name</th>
            <th>Role</th>
            <th>Assigned Store</th>
            <th>Status</th>
            <th>Account Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.username}">
                manager
            </td>

            <td th:text="${user.fullName}">
                System Manager
            </td>

            <td th:text="${user.role}">
                MANAGER
            </td>

            <td th:text="${user.assignedStore != null
                    ? user.assignedStore.name
                    : 'All Stores'}">
                All Stores
            </td>

            <td th:text="${user.enabled ? 'Active' : 'Disabled'}">
                Active
            </td>

            <td>
                <!-- The manager account cannot be edited or disabled here. -->
                <span th:if="${user.username == 'manager'}">
                    Protected
                </span>

                <div th:if="${user.username != 'manager'}">
                    <a th:href="@{/users/{id}/edit(id=${user.id})}">
                        Edit
                    </a>

                    <br><br>

                    <!-- This changes the account status without deleting data. -->
                    <form th:action="@{/users/{id}/toggle-status(id=${user.id})}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <button type="submit"
                                th:text="${user.enabled ? 'Disable' : 'Enable'}">
                            Disable
                        </button>
                    </form>
                </div>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="6">
                No user accounts found.
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
