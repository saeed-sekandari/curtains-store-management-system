<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Supplier Payment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        .topbar {
            background: #173b68;
            color: white;
            padding: 20px 7%;
        }

        .topbar h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        main {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(25, 53, 87, .1);
        }

        h2 {
            margin-top: 0;
            color: #173b68;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .required {
            color: #b42318;
        }

        .help-text {
            color: #667085;
            line-height: 1.5;
        }

        .error-message {
            background: #fff1f0;
            border: 1px solid #f2a6a0;
            color: #b42318;
            padding: 14px;
            border-radius: 8px;
            margin: 20px 0;
            line-height: 1.5;
            font-weight: bold;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button,
        a {
            flex: 1;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 1rem;
            cursor: pointer;
        }

        button {
            background: #d69b2d;
            color: white;
        }

        button:hover {
            background: #b9801e;
        }

        .cancel-button {
            background: #e2e8f0;
            color: #172033;
        }

        .cancel-button:hover {
            background: #cbd5e1;
        }
    </style>
</head>

<body>

<header class="topbar">
    <h1>Royal Curtains Store Management</h1>
</header>

<main>
    <section class="card">

        <h2>Record Supplier Payment</h2>

        <p>
            Store:
            <strong th:text="${store.name}">
                Store name
            </strong>
        </p>

        <p class="help-text">
            Record money paid to a supplier. The payment will reduce the supplier's outstanding balance.
        </p>

        <div class="error-message"
             th:if="${error}"
             th:text="${error}">
            Payment error message
        </div>

        <form th:action="@{/supplier-payments}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <input type="hidden"
                   name="storeCode"
                   th:value="${store.code}">

            <label for="supplierId">
                Supplier <span class="required">*</span>
            </label>

            <select id="supplierId"
                    name="supplierId"
                    required>

                <option value="">
                    Select supplier
                </option>

                <option th:each="supplier : ${suppliers}"
                        th:value="${supplier.id}"
                        th:text="${supplier.name}">
                    Supplier name
                </option>
            </select>

            <label for="paymentDate">
                Payment Date and Time
            </label>

            <input id="paymentDate"
                   name="paymentDate"
                   type="datetime-local">

            <label for="amount">
                Payment Amount <span class="required">*</span>
            </label>

            <input id="amount"
                   name="amount"
                   type="number"
                   min="0.01"
                   step="0.01"
                   placeholder="Example: 50000"
                   required>

            <label for="currency">
                Currency <span class="required">*</span>
            </label>

            <select id="currency"
                    name="currency"
                    required>

                <option value="AFN">
                    AFN
                </option>

                <option value="USD">
                    USD
                </option>
            </select>

            <label for="receivedBy">
                Person Who Received the Money <span class="required">*</span>
            </label>

            <input id="receivedBy"
                   name="receivedBy"
                   type="text"
                   placeholder="Example: Haji Fridoon"
                   required>

            <label for="notes">
                Notes
            </label>

            <textarea id="notes"
                      name="notes"
                      placeholder="Add any useful payment details"></textarea>

            <div class="button-row">

                <button type="submit">
                    Save Payment
                </button>

                <a class="cancel-button"
                   th:href="@{/supplier-payments(store=${store.code})}">
                    Cancel
                </a>

            </div>

        </form>

    </section>
</main>

</body>
</html>
