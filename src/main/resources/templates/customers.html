<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Customers</title>
</head>

<body>

<main>
    <h1>
        Customers -
        <span th:text="${selectedStore.name}">
            Store Name
        </span>
    </h1>

    <p>
        <a th:href="@{/customers/new(store=${selectedStore.code})}">
            Add Customer
        </a>
        |

        <a th:if="${currentRole == 'MANAGER'}"
           href="/dashboard">
            Back to Manager Dashboard
        </a>

        <a th:if="${currentRole != 'MANAGER'}"
           href="/employee-dashboard">
            Back to Employee Dashboard
        </a>
    </p>

    <table border="1" cellpadding="8">
        <thead>
        <tr>
            <th>Full Name</th>
            <th>Phone</th>
            <th>Address</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="customer : ${customers}">
            <td th:text="${customer.fullName}">
                Customer Name
            </td>

            <td th:text="${customer.phone}">
                Phone Number
            </td>

            <td th:text="${customer.address}">
                Address
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(customers)}">
            <td colspan="3">
                No customers found for this store.
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
