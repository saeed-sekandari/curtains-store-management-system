<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${systemName}">Store Management</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f4f7fb; color: #172033; }
        .topbar { background: #173b68; color: white; padding: 20px 7%; }
        .topbar h1 { margin: 0; font-size: 1.5rem; }
        main { max-width: 1050px; margin: 45px auto; padding: 0 24px; }
        .intro { margin-bottom: 28px; }
        .intro h2 { font-size: 2rem; margin-bottom: 8px; }
        .intro p { color: #536174; font-size: 1.05rem; }
        .stores { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .store-card { background: white; border-radius: 14px; padding: 25px; box-shadow: 0 5px 18px rgba(25, 53, 87, .08); border: 1px solid #e2e8f0; }
        .store-card h3 { margin-top: 0; color: #173b68; }
        .store-card p { color: #667085; line-height: 1.5; }
        .button { display: inline-block; margin-top: 10px; background: #d69b2d; color: white; padding: 11px 18px; border-radius: 8px; text-decoration: none; }
    </style>
</head>
<body>
<header class="topbar"><h1 th:text="${systemName}">Store Management</h1></header>
<main>
    <section class="intro">
        <h2>Welcome</h2>
        <p>This is the first foundation of the bilingual management system.</p>
    </section>
    <section class="stores">
        <article class="store-card" th:each="store : ${stores}">
            <h3 th:text="${store}">Store name</h3>
            <p>Customers, orders, inventory, payments, expenses, and reports for this store.</p>
            <a class="button" href="#">Open store</a>
        </article>
    </section>
</main>
</body>
</html>
