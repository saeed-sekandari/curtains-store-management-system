<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${systemName}">
        Store Management
    </title>

    <style>
        /* Basic page colors and font. */
        :root {
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #172033;
        }

        /* Main title bar. */
        .topbar {
            background: #173b68;
            color: white;
            padding: 20px 7%;
        }

        .topbar h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        main {
            max-width: 1050px;
            margin: 45px auto;
            padding: 0 24px;
        }

        .intro {
            margin-bottom: 28px;
        }

        .intro h2 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .intro p {
            color: #536174;
            font-size: 1.05rem;
        }

        /* Keeps the two store cards responsive. */
        .stores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .store-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 5px 18px rgba(25, 53, 87, .08);
        }

        .store-card h3 {
            margin-top: 0;
            color: #173b68;
        }

        .store-card p {
            color: #667085;
            line-height: 1.5;
        }

        /* One sign-in button is used by all account types. */
        .login-area {
            text-align: center;
            margin-top: 32px;
        }

        .button {
            display: inline-block;
            background: #d69b2d;
            color: white;
            padding: 13px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
        }

        .button:hover {
            background: #b9801e;
        }
    </style>
</head>

<body>

<!-- Displays the name of the complete management system. -->
<header class="topbar">
    <h1 th:text="${systemName}">
        Store Management
    </h1>
</header>

<main>
    <!-- Short explanation shown on the welcome page. -->
    <section class="intro">
        <h2>Welcome</h2>

        <p>
            Sign in to access your account.
        </p>
    </section>

    <!-- These cards identify the two stores in the system. -->
    <section class="stores">
        <article class="store-card" th:each="store : ${stores}">
            <h3 th:text="${store}">
                Store name
            </h3>

            <p>
                Customers, orders, inventory, payments, expenses, and reports
                for this store.
            </p>
        </article>
    </section>

    <!-- Managers and employees use the same sign-in page. -->
    <div class="login-area">
        <a class="button" href="/login">
            Sign In
        </a>
    </div>
</main>

</body>
</html>
