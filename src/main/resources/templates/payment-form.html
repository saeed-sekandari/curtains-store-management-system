<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Record Payment</title>
</head>

<body>

<main>
    <h1>Record Payment</h1>

    <p>
        Order Number:
        <strong th:text="${order.orderNumber}">
            1001
        </strong>
    </p>

    <p>
        Customer:
        <strong th:text="${order.customer.fullName}">
            Customer Name
        </strong>
    </p>

    <form th:action="@{/orders/{id}/payments(id=${order.id})}"
          method="post">

        <!-- Protects the payment form from unwanted requests. -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div>
            <label for="amount">Amount:</label>
            <input type="number"
                   id="amount"
                   name="amount"
                   min="0.01"
                   step="0.01"
                   required>
        </div>

        <br>

        <div>
            <label for="currency">Currency:</label>
            <select id="currency"
                    name="currency"
                    required>
                <option value="AFN">AFN</option>
                <option value="USD">USD</option>
            </select>
        </div>

        <br>

        <div>
            <label for="paymentType">Payment Type:</label>
            <select id="paymentType"
                    name="paymentType"
                    required>
                <option value="DEPOSIT">Deposit</option>
                <option value="BALANCE">Final Balance</option>
                <option value="OTHER">Other Payment</option>
            </select>
        </div>

        <br>

        <div>
            <label for="paymentMethod">Payment Method:</label>
            <select id="paymentMethod"
                    name="paymentMethod"
                    required>
                <option value="CASH">Cash</option>
                <option value="BANK_TRANSFER">Bank Transfer</option>
                <option value="OTHER">Other</option>
            </select>
        </div>

        <br>

        <div>
            <label for="notes">Notes:</label>
            <textarea id="notes"
                      name="notes"
                      rows="4"
                      cols="40"></textarea>
        </div>

        <br>

        <button type="submit">Save Payment</button>

        <a th:href="@{/orders/{id}/payments(id=${order.id})}">
            Cancel
        </a>
    </form>
</main>

</body>
</html>
