<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Login</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f7fb; color: #172033; font-family: Arial, sans-serif; }
        .topbar { background: #173b68; color: white; padding: 20px 7%; }
        .topbar h1 { margin: 0; font-size: 1.5rem; }
        .card { max-width: 430px; margin: 70px auto; background: white; padding: 32px; border-radius: 14px; box-shadow: 0 5px 18px rgba(25, 53, 87, .1); }
        h2 { margin-top: 0; color: #173b68; }
        label { display: block; margin: 18px 0 7px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        button { width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 8px; background: #d69b2d; color: white; font-size: 1rem; cursor: pointer; }
        .error { color: #b42318; margin-top: 15px; }
        .hint { color: #667085; font-size: .9rem; line-height: 1.5; }
    </style>
</head>
<body>
<header class="topbar"><h1>Royal Curtains Store Management</h1></header>
<main class="card">
    <h2>Manager Login</h2>
    <p class="hint">Sign in to manage both stores and view the manager dashboard.</p>
    <p class="error" th:if="${param.error}">The username or password is incorrect.</p>
    <p class="hint" th:if="${param.logout}">You have been logged out.</p>
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
