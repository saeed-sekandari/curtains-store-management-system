<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Orders</title>
</head>

<body>

<main>
    <h1>
        Orders -
        <span th:text="${selectedStore.name}">
            Store Name
        </span>
    </h1>

    <p>
        <a th:href="@{/orders/new(store=${selectedStore.code})}">
            New Order
        </a>
        |

        <a th:if="${currentRole == 'MANAGER'}"
           href="/dashboard">
            Back to Manager Dashboard
        </a>

        <a th:if="${currentRole != 'MANAGER'}"
           href="/employee-dashboard">
            Back to Employee Dashboard
        </a>
    </p>

    <table border="1" cellpadding="8">
        <thead>
        <tr>
            <th>Order Number</th>
            <th>Customer</th>
            <th>Total</th>
            <th>Paid</th>
            <th>Remaining Balance</th>
            <th>Status</th>
            <th>Payments</th>
            <th>Order Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.orderNumber}">
                1001
            </td>

            <td th:text="${order.customer.fullName}">
                Customer Name
            </td>

            <td>
                <span th:text="${order.totalAmount}">
                    0
                </span>
                AFN
            </td>

            <td>
                <span th:text="${paidAmounts[order.id]}">
                    0
                </span>
                AFN
            </td>

            <td>
                <span th:text="${remainingAmounts[order.id]}">
                    0
                </span>
                AFN
            </td>

            <td>
                <strong th:text="${order.status}">
                    NEW
                </strong>

                <br>

                <small th:if="${order.cancellationReason != null}"
                       th:text="${order.cancellationReason}">
                    Cancellation reason
                </small>
            </td>

            <td>
                <a th:href="@{/orders/{id}/payments(id=${order.id})}">
                    View Payments
                </a>

                <br>

                <a th:if="${order.status != 'CANCELLED'}"
                   th:href="@{/orders/{id}/payments/new(id=${order.id})}">
                    Record Payment
                </a>
            </td>

            <td>
                <!-- Only managers can cancel active orders. -->
                <div th:if="${currentRole == 'MANAGER'
                        and order.status != 'CANCELLED'}">

                    <form th:action="@{/orders/{id}/cancel(id=${order.id})}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <input type="text"
                               name="cancellationReason"
                               placeholder="Reason for cancellation"
                               required>

                        <button type="submit">
                            Cancel Order
                        </button>
                    </form>
                </div>

                <span th:if="${order.status == 'CANCELLED'}">
                    N/A
                </span>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(orders)}">
            <td colspan="8">
                No orders found for this store.
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
