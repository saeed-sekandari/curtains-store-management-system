<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Orders</title>
</head>

<body>

<main>
    <h1>
        Orders -
        <span th:text="${selectedStore.name}">
            Store Name
        </span>
    </h1>

    <p>
        <a th:href="@{/orders/new(store=${selectedStore.code})}">
            New Order
        </a>
        |

        <a th:if="${currentRole == 'MANAGER'}"
           href="/dashboard">
            Back to Manager Dashboard
        </a>

        <a th:if="${currentRole != 'MANAGER'}"
           href="/employee-dashboard">
            Back to Employee Dashboard
        </a>
    </p>

    <table border="1" cellpadding="8">
        <thead>
        <tr>
            <th>Order Number</th>
            <th>Customer</th>
            <th>Total</th>
            <th>Paid</th>
            <th>Remaining Balance</th>
            <th>Status</th>
            <th>Payments</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.orderNumber}">
                1001
            </td>

            <td th:text="${order.customer.fullName}">
                Customer Name
            </td>

            <td>
                <span th:text="${order.totalAmount}">
                    0
                </span>
                AFN
            </td>

            <td>
                <span th:text="${paidAmounts[order.id]}">
                    0
                </span>
                AFN
            </td>

            <td>
                <span th:text="${remainingAmounts[order.id]}">
                    0
                </span>
                AFN
            </td>

            <td th:text="${order.status}">
                NEW
            </td>

            <td>
                <a th:href="@{/orders/{id}/payments(id=${order.id})}">
                    View Payments
                </a>

                <br>

                <a th:href="@{/orders/{id}/payments/new(id=${order.id})}">
                    Record Payment
                </a>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(orders)}">
            <td colspan="7">
                No orders found for this store.
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
