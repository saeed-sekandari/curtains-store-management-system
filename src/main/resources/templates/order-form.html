<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Order</title>
</head>

<body>

<main>
    <h1>New Order</h1>

    <p>
        Store:
        <strong th:text="${selectedStore.name}">
            Store Name
        </strong>
    </p>

    <form action="/orders" method="post">

        <!-- Protects the form from unwanted requests. -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <input type="hidden"
               name="storeCode"
               th:value="${selectedStore.code}">

        <h2>Customer</h2>

        <p>
            Select an existing customer, or enter information for a new customer.
        </p>

        <div>
            <label for="customerId">Existing Customer:</label>

            <select id="customerId"
                    name="customerId">

                <option value="">
                    New Customer
                </option>

                <option th:each="customer : ${customers}"
                        th:value="${customer.id}"
                        th:text="${customer.fullName}">
                    Existing Customer
                </option>
            </select>
        </div>

        <h3>New Customer Information</h3>

        <div>
            <label for="newCustomerName">Customer Name:</label>

            <input type="text"
                   id="newCustomerName"
                   name="newCustomerName">
        </div>

        <br>

        <div>
            <label for="newCustomerPhone">Phone:</label>

            <input type="text"
                   id="newCustomerPhone"
                   name="newCustomerPhone">
        </div>

        <br>

        <div>
            <label for="newCustomerAddress">Address:</label>

            <input type="text"
                   id="newCustomerAddress"
                   name="newCustomerAddress">
        </div>

        <h2>Order Information</h2>

        <div>
            <label for="orderNumber">Order Number:</label>

            <input type="text"
                   id="orderNumber"
                   name="orderNumber"
                   required>
        </div>

        <br>

        <div>
            <label for="totalAmount">Total Amount (AFN):</label>

            <input type="number"
                   id="totalAmount"
                   name="totalAmount"
                   min="0"
                   step="1"
                   required>
        </div>

        <h2>Initial Payment</h2>

        <p>
            Leave the amount empty if the customer has not paid yet.
        </p>

        <div>
            <label for="initialPaymentAmount">
                First Payment or Down Payment (AFN):
            </label>

            <input type="number"
                   id="initialPaymentAmount"
                   name="initialPaymentAmount"
                   min="0"
                   step="1">
        </div>

        <br>

        <div>
            <label for="initialPaymentMethod">
                Payment Method:
            </label>

            <select id="initialPaymentMethod"
                    name="initialPaymentMethod">

                <option value="CASH">Cash</option>
                <option value="BANK_TRANSFER">Bank Transfer</option>
                <option value="OTHER">Other</option>
            </select>
        </div>

        <br>

        <button type="submit">
            Save Order
        </button>

        <a th:href="@{/orders(store=${selectedStore.code})}">
            Cancel
        </a>
    </form>
</main>

</body>
</html>
