<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Tailor Assignment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        .topbar {
            background: #173b68;
            color: white;
            padding: 20px 7%;
        }

        .topbar h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        main {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(25, 53, 87, .1);
        }

        h2 {
            margin-top: 0;
            color: #173b68;
        }

        h3 {
            color: #173b68;
            margin-top: 25px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }

        .info {
            background: #f8fafc;
            border-left: 4px solid #d69b2d;
            padding: 15px;
            margin: 20px 0;
            line-height: 1.6;
        }

        .help-text {
            color: #667085;
            font-size: .92rem;
            line-height: 1.5;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button,
        a {
            flex: 1;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 1rem;
            cursor: pointer;
        }

        button {
            background: #d69b2d;
            color: white;
        }

        button:hover {
            background: #b9801e;
        }

        .cancel-button {
            background: #e2e8f0;
            color: #172033;
        }

        .cancel-button:hover {
            background: #cbd5e1;
        }
    </style>
</head>

<body>

<header class="topbar">
    <h1>Royal Curtains Store Management</h1>
</header>

<main>
    <section class="card">

        <h2>Edit Tailor Assignment</h2>

        <p>
            Order number:
            <strong th:text="${order.orderNumber}">
                1001
            </strong>
        </p>

        <div class="info">
            <div>
                <strong>Product:</strong>
                <span th:text="${item.productType}">
                    CURTAIN
                </span>
            </div>

            <div>
                <strong>Customer:</strong>
                <span th:text="${order.customer.fullName}">
                    Customer name
                </span>
            </div>

            <div>
                <strong>Room:</strong>
                <span th:text="${item.roomName}">
                    Bedroom
                </span>
            </div>

            <div>
                <strong>Required completion date:</strong>
                <span th:text="${item.requiredCompletionDate}">
                    2026-10-29
                </span>
            </div>
        </div>

        <p class="help-text">
            You are changing only the assigned tailor.
            The measurements, fabric, design, and payment information will not change.
        </p>

        <form th:action="@{/orders/{orderId}/items/{itemId}/assignment(
                              orderId=${order.id},
                              itemId=${item.id})}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <label for="tailorId">
                Assigned Tailor
            </label>

            <select id="tailorId" name="tailorId">

                <option value="">
                    Not assigned
                </option>

                <option th:each="tailor : ${tailors}"
                        th:value="${tailor.id}"
                        th:text="${tailor.fullName}"
                        th:selected="${item.assignedTailor != null
                                      and item.assignedTailor.id == tailor.id}">
                    Tailor name
                </option>

            </select>

            <div class="button-row">

                <button type="submit">
                    Save Assignment
                </button>

                <a class="cancel-button"
                   th:href="@{/orders/{orderId}/items(orderId=${order.id})}">
                    Cancel
                </a>

            </div>

        </form>

    </section>
</main>

</body>
</html>
