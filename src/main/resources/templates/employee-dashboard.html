<!DOCTYPE html>
<html lang="en"
      dir="ltr"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        .topbar {
            background: #173b68;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        .logout {
            border: 0;
            color: white;
            background: #b42318;
            padding: 9px 14px;
            border-radius: 7px;
            font-size: 1rem;
            cursor: pointer;
        }

        .logout:hover {
            background: #8f1c13;
        }

        main {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 22px;
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(25, 53, 87, 0.08);
        }

        h2,
        h3 {
            margin-top: 0;
            color: #173b68;
        }

        .store-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d69b2d;
        }

        .notification {
            padding: 15px;
            margin-top: 12px;
            border-left: 5px solid #d69b2d;
            border-radius: 7px;
            background: #fff8e7;
        }

        .notification-message {
            display: block;
            margin-bottom: 8px;
        }

        .notification-time {
            display: block;
            margin-bottom: 12px;
            color: #667085;
            font-size: 0.85rem;
        }

        .read-button {
            border: 0;
            padding: 8px 12px;
            border-radius: 6px;
            background: #173b68;
            color: white;
            cursor: pointer;
        }

        .read-button:hover {
            background: #0f2b4d;
        }

        .empty {
            color: #667085;
        }

        .links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 11px 16px;
            border-radius: 8px;
            background: #173b68;
            color: white;
            text-decoration: none;
        }

        .button:hover {
            background: #0f2b4d;
        }
    </style>
</head>

<body>

<header class="topbar">

    <h1>Employee Dashboard</h1>

    <form th:action="@{/logout}"
          method="post"
          style="display: inline;">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button class="logout"
                type="submit">
            Log out
        </button>
    </form>

</header>

<main>

    <section class="card">

        <h2>
            Welcome,
            <span th:text="${fullName}">
                Employee
            </span>
        </h2>

        <p>
            You are signed in as
            <strong th:text="${role}">
                EMPLOYEE
            </strong>.
        </p>

        <p>Your assigned store:</p>

        <p class="store-name"
           th:text="${assignedStoreName}">
            Store name
        </p>

    </section>

    <section class="card">

        <h2>
            Notifications

            <span th:if="${unreadNotificationCount > 0}"
                  th:text="${'(' + unreadNotificationCount + ' new)'}">
                (1 new)
            </span>
        </h2>

        <div class="notification"
             th:each="notification : ${notifications}"
             th:if="${!notification.read}">

            <strong class="notification-message"
                    th:text="${notification.message}">
                Order completed.
            </strong>

            <span class="notification-time"
                  th:text="${#temporals.format(
                      notification.createdAt,
                      'yyyy-MM-dd HH:mm')}">
                2026-10-08 13:43
            </span>

            <form th:action="@{/notifications/{id}/read(
                              id=${notification.id})}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button class="read-button"
                        type="submit">
                    Mark as Read
                </button>
            </form>
        </div>

        <p class="empty"
           th:if="${unreadNotificationCount == 0}">
            No new notifications.
        </p>

    </section>

    <section class="card">

        <h3>Store Work</h3>

        <div class="links">

            <a class="button"
               th:if="${assignedStoreCode != null
                       and !assignedStoreCode.isBlank()}"
               th:href="@{/customers(store=${assignedStoreCode})}">
                View Customers
            </a>

            <a class="button"
               th:if="${assignedStoreCode != null
                       and !assignedStoreCode.isBlank()}"
               th:href="@{/orders(store=${assignedStoreCode})}">
                View Orders
            </a>

            <a class="button"
               th:if="${assignedStoreCode != null
                       and !assignedStoreCode.isBlank()}"
               th:href="@{/inventory(store=${assignedStoreCode})}">
                View Inventory
            </a>

            <a class="button"
               href="/my-payments">
                My Payments
            </a>

        </div>

    </section>

</main>

</body>
</html>
